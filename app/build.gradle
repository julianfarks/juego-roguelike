plugins {
    id 'com.android.application'
}

android {
    namespace 'com.julianfarks.roguelike'
    compileSdk 34

    defaultConfig {
        applicationId 'com.julianfarks.roguelike'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    buildTypes {
        debug { debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
