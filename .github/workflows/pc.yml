name: Build EXE (Windows PC)
on:
  push:
    branches: [main]
    paths:
      - 'PC/**'
      - 'Shared/**'
      - '.github/workflows/pc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  engine-smoke:            # el mismo motor con el comportamiento de PC, sin ventana (rapido, en Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Motor en modo PC (600 fotogramas, sin ventana)
        run: PC/run.sh --headless --pc --frames 600 --store /tmp/pc_store.properties
  windows:
    runs-on: windows-latest
    needs: engine-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Compilar y empaquetar (javac + jpackage)
        shell: bash
        run: |
          rc=0
          bash PC/build.sh > build.log 2>&1 || rc=$?
          cat build.log
          if [ "$rc" -ne 0 ]; then echo "::error title=PC/build.sh fallo::$(tail -n 25 build.log | tr '\n' '|' | cut -c1-1500)"; exit $rc; fi
      - name: Prueba de arranque del EXE (recursos, OGG, motor)
        shell: pwsh
        run: |
          $exe = "PC/build/dist/SwordsmanMagic/SwordsmanMagic.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          $dir = Join-Path $env:APPDATA "SwordsmanMagic-EternalAbyss"
          $out = ""
          if (Test-Path "$dir/selftest.txt") { $out += (Get-Content "$dir/selftest.txt" -Raw) }
          if (Test-Path "$dir/log.txt") { $out += "---- log.txt ---- " + ((Get-Content "$dir/log.txt" | Select-Object -First 40) -join " | ") }
          Write-Host $out
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            $msg = ("exit " + $p.ExitCode + " :: " + $out) -replace "[\r\n]+", " | "
            if ($msg.Length -gt 1800) { $msg = $msg.Substring(0, 1800) }
            Write-Host "::error title=selftest fallo::$msg"
            exit 1
          }
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path "PC/build/dist/SwordsmanMagic" -DestinationPath SwordsmanMagic-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SwordsmanMagic-windows
          path: SwordsmanMagic-Windows.zip
      - name: Publicar Release (latest-pc)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-pc -y --cleanup-tag || true
          gh release create latest-pc SwordsmanMagic-Windows.zip --title "SwordsmanMagic para Windows (última versión)" --notes "Descomprime el ZIP y ejecuta SwordsmanMagic.exe (no hace falta instalar Java). Commit: ${{ github.sha }}"
