name: Build APK (Android)
on:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - 'Shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        working-directory: Android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Renombrar APK
        run: cp Android/app/build/outputs/apk/debug/app-debug.apk SwordmanRogue.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SwordmanRogue-apk
          path: SwordmanRogue.apk
      - name: Publicar Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SwordmanRogue.apk --title "SwordmanRogue (última versión)" --notes "APK instalable (debug firmado). Commit: ${{ github.sha }}"
